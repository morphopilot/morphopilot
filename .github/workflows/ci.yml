name: Check source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: deploy/requirements-cpu.lock
      - run: python -m pip install -r deploy/requirements-cpu.lock -r deploy/requirements-test.lock
      - run: python -m pytest tests/test_*.py deploy/test_gateway.py -q
      - run: python deploy/smoke-cpu.py
      - run: python examples/generate_synthetic.py --output-dir examples/generated
      - run: python scripts/check_publication.py
